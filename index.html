<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Task Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <h1>Welcome Back</h1>
      <p>Please enter your details to sign in</p>
    </div>

    <!-- Alert Box for Success/Error Messages -->
    <div id="alertBox" class="alert"></div>

    <form id="loginForm">
      <!-- Email / Username Field -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          placeholder="name@example.com" 
          autocomplete="email"
          required
        >
      </div>

      <!-- Password Field with Show/Hide Toggle -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="password" 
            placeholder="••••••••" 
            autocomplete="current-password"
            required
          >
          <button type="button" id="togglePassword" class="toggle-password">Show</button>
        </div>
      </div>

      <!-- Remember Me & Forgot Password -->
      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" id="rememberMe">
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot-password" onclick="alert('Password reset link sent to demo!'); return false;">Forgot password?</a>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" class="btn-submit">Sign In</button>
    </form>

    <!-- Footer Links -->
    <div class="login-footer">
      Don't have an account? <a href="#" onclick="alert('Registration page demo!'); return false;">Sign up</a>
    </div>

    <!-- Demo Credentials Helper -->
    <div class="demo-credentials">
      Demo account: <strong>admin@example.com</strong><br>
      Password: <strong>password123</strong>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
